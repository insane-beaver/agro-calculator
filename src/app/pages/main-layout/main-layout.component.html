<div class="background-img">
  <div id="main" class="layout-box">
    <div class="top-bar" id="header">
      <nav class="d-flex navbar navbar-dark header">
        <div class="d-flex justify-content-start">
          <button id="menu" type="button" class="menu" [class.opened]="isOpened" aria-label="Головне меню"
                  [attr.aria-expanded]="isOpened" aria-controls="mySidebar" (click)="toggleOverlay()">
            <svg width="100%" height="100%" viewBox="0 0 100 100" aria-hidden="true">
              <path class="line line1" d="M 20,29.000046 H 80.000231 C 80.000231,29.000046 94.498839,28.817352 94.532987,66.711331 94.543142,77.980673 90.966081,81.670246 85.259173,81.668997 79.552261,81.667751 75.000211,74.999942 75.000211,74.999942 L 25.000021,25.000058" />
              <path class="line line2" d="M 20,50 H 80" />
              <path class="line line3" d="M 20,70.999954 H 80.000231 C 80.000231,70.999954 94.498839,71.182648 94.532987,33.288669 94.543142,22.019327 90.966081,18.329754 85.259173,18.331003 79.552261,18.332249 75.000211,25.000058 75.000211,25.000058 L 25.000021,74.999942" />
            </svg>
          </button>
          <a class="ml-3 navbar-brand" routerLink="/">
            AgroCalc
          </a>
        </div>
      </nav>

      <nav id="mySidebar" class="sidebar" [class.sidebar-open]="isOpened" (click)="closeOverlay()">
        <div class="sidebar-content" [class.sidebar-content-open]="isOpened">
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Основний калькулятор</a>
          <a routerLink="/reverse-calc" routerLinkActive="active">Зворотній калькулятор</a>
        </div>
      </nav>
    </div>

    <main class="page-content main" id="content">
      <div class="content">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>

  <!-- Site footer -->
  <footer class="site-footer">
    <div class="container">
      <hr>
      <div class="row">
        <div class="col-md-8 col-sm-6 col-xs-12">
          <p class="copyright-text">Copyright &copy; {{year}}. All rights reserved.</p>
        </div>
        <div class="col-md-4 col-sm-6 col-xs-12 footer-author">
          <p class="copyright-text">Oleksandr Vaskov</p>
          <ul class="social-icons">
            <li><a class="linkedin" href="https://www.linkedin.com/in/oleksandr-vaskov-9828441b7/" target="_blank"
                   rel="noopener noreferrer" aria-label="LinkedIn"><i class="bi bi-linkedin"></i></a></li>
          </ul>
        </div>
      </div>
    </div>
  </footer>
</div>
