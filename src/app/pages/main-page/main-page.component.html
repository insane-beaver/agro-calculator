<div>
  <form class="md-float-material form-material" #CalcForm="ngForm" (ngSubmit)="calculate(CalcForm)">
    <div class="input-group input-group-lg">
      <label class="input-group-text input-text-border" for="bRows"><span class="input-text">Міжряддя</span></label>
      <input id="bRows" type="number" min="0.1" step="0.1" name="bRows" [ngModel]="bRows" required
             class="form-control" aria-describedby="bRows-unit">
      <span class="input-group-text" id="bRows-unit">(см)</span>
    </div>
    <br>
    <div class="input-group input-group-lg">
      <label class="input-group-text input-text-border" for="gp"><span class="input-text">Норма висіву</span></label>
      <input id="gp" type="text" inputmode="decimal" #gp_input="ngModel" name="gp" [ngModel]="gp"
             (input)="gpData(gp_input)" required class="form-control" aria-describedby="gp-unit"/>
      <span class="input-group-text" id="gp-unit">(нас/га)</span>
    </div>
    <br>
    <div class="d-flex justify-content-center">
      <button type="submit" class="btn btn-lg btn-secondary" style="width: 100%" [disabled]="CalcForm.invalid">
        Обрахувати
      </button>
    </div>
  </form>
  <br>
  <div class="alert alert-danger" role="alert" *ngIf="error">{{error}}</div>
  <table class="result-table" *ngIf="isCounted">
    <tr>
      <td>Метр погонний:</td>
      <td>{{mp}}</td>
      <td>(м/м²)</td>
    </tr>
    <tr>
      <td>Відстань між насінинами:</td>
      <td>{{d}}</td>
      <td>(см)</td>
    </tr>
    <tr>
      <td>Штук / метр:</td>
      <td>{{numbOnM}}</td>
      <td>(нас/мп)</td>
    </tr>
  </table>
</div>
